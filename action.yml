apiVersion: automation.cloudbees.io/v1alpha1
kind: action
name: 'Register build artifacts'
description: 'Registers artifact versions in CloudBees Unify for artifacts produced during a workflow run.'

inputs:
  artifact-metadata:
    description: |
      A JSON array of artifact metadata objects. Each object should contain the fields:
        - name
        - version
        - url
        - digest (optional)
        - labels (optional)
        - commit (optional)
        - repositoryUrl (optional)
        - ref (optional)
        - componentId (optional)
        - type (optional)
    required: true

outputs:
  artifact-ids:
    value: ${{ steps.register-build-artifacts.outputs.artifact-ids }}
    description: "The unique identifiers in JSON format of the artifacts when multiple are registered."

runs:
  using: composite
  steps:
    - id: register-build-artifacts
      name: Register Build Artifacts
      uses: docker://public.ecr.aws/l7o7z1g8/actions/cb-utils:main-0.1.59
      run: |
        if [ -z "$INPUT_METADATA" ]; then
          echo "Error: artifact-metadata input is required."
          exit 1
        fi
        echo "$INPUT_METADATA" | jq empty
        if [ $? -ne 0 ]; then
          echo "Error: artifact-metadata input is not valid JSON."
          exit 1
        fi
        
        # Set the fold width to match the table column width
        FOLD_WIDTH=48

        # Number of attempts and the delay in seconds between them for the CloudBees Unify API call
        MAX_ATTEMPTS=30
        RETRY_DELAY=10
        
        # Helper function to fold and print a parameter name and value 
        fold_and_print() {
          local pName="$1"
          local pValue="$2"
          folded=$(echo "$pValue" | fold -s -w $FOLD_WIDTH)
          first=1
          echo "$folded" | while IFS= read -r line; do
            if [ $first -eq 1 ]; then
              printf "| \033[1m%-20s\033[0m | %-50s |\n" "$pName" "$line"
              first=0
            else
              printf "| \033[1m%-20s\033[0m | %-50s |\n" "" "$line"
            fi
          done
        }
        
        # Function to print inputs in a formatted table
        print_inputs() {
          echo "+----------------------+----------------------------------------------------+"
          printf "| \033[1m%-20s\033[0m | \033[1m%-50s\033[0m |\n" "Parameter" "Value"
          echo "+----------------------+----------------------------------------------------+"
          printf "| \033[1m%-20s\033[0m | %-50s |\n" "name" "$inputName"
          fold_and_print "url" "$inputUrl"
          printf "| \033[1m%-20s\033[0m | %-50s |\n" "version" "$inputVersion"
          fold_and_print "digest" "$inputDigest"
          printf "| \033[1m%-20s\033[0m | %-50s |\n" "component-id" "$inputComponentId"
          printf "| \033[1m%-20s\033[0m | %-50s |\n" "commit" "$inputCommit"
          fold_and_print "repository-url" "$inputRepositoryUrl"
          printf "| \033[1m%-20s\033[0m | %-50s |\n" "ref" "$inputRef"
          printf "| \033[1m%-20s\033[0m | %-50s |\n" "type" "$inputType"
          fold_and_print "labels" "$inputLabels"
          echo "+----------------------+----------------------------------------------------+"        
        }
        
        # Parse the artifact-metadata input JSON array and register each artifact
        echo "Registering build artifacts..."
        artifact_count=$(echo "$INPUT_METADATA" | jq 'length')
        printf "Number of artifacts to register: $artifact_count\n\n"
        
        # Initialize an empty JSON object to hold registered artifact IDs with their URLs
        registered_ids_json="{}"
        
        for i in $(seq 0 $((artifact_count - 1))); do
          artifact=$(echo "$INPUT_METADATA" | jq ".[$i]")
          
          inputName=$(echo "$artifact" | jq -r '.name')
          inputVersion=$(echo "$artifact" | jq -r '.version')
          inputUrl=$(echo "$artifact" | jq -r '.url')
          inputDigest=$(echo "$artifact" | jq -r '.digest // empty')
          inputLabels=$(echo "$artifact" | jq --compact-output '.labels // empty')
          inputCommit=$(echo "$artifact" | jq -r '.commit // empty')
          inputRepositoryUrl=$(echo "$artifact" | jq -r '.repositoryUrl // empty')
          inputRef=$(echo "$artifact" | jq -r '.ref // empty')
          inputType=$(echo "$artifact" | jq -r '.type // empty')
          inputComponentId=$(echo "$artifact" | jq -r '.componentId // empty')
          
          echo "Registering artifact $((i + 1)) of $artifact_count: $inputName, version $inputVersion"
          
          # Create the payload JSON with jq so that quotes, backslashes and control characters in the
          # input values are escaped. Optional fields are added only when provided
          payload=$(jq -n --compact-output \
            --arg runId "$CLOUDBEES_RUN_ID" \
            --arg runAttempt "$CLOUDBEES_RUN_ATTEMPT" \
            --arg name "$inputName" \
            --arg url "$inputUrl" \
            --arg version "$inputVersion" \
            --arg commit "$inputCommit" \
            --arg repositoryUrl "$inputRepositoryUrl" \
            --arg ref "$inputRef" \
            --arg digest "$inputDigest" \
            --arg labels "$inputLabels" \
            --arg componentId "$inputComponentId" \
            --arg type "$inputType" '
            {runId: $runId, runAttempt: $runAttempt, name: $name, url: $url, version: $version}
            + (if $commit != "" then {commit: {repositoryUrl: $repositoryUrl, commitId: $commit, ref: $ref}} else {} end)
            + (if $digest != "" then {digest: $digest} else {} end)
            + (if $labels != "" then {labels: ($labels | fromjson)} else {} end)
            + (if $componentId != "" then {componentId: $componentId} else {} end)
            + (if $type != "" then {type: $type} else {} end)
          ') || {
            echo "Error: failed to create the request payload for artifact $inputName."
            exit 1
          }
          # Save payload to a temporary file
          printf '%s\n' "$payload" > /tmp/payload.json
        
          # Display the generated payload
          echo "Request payload:"
          print_inputs
        
          # Make CloudBees Unify API call to create artifact_info record
          # Retry only transient failures (connection errors, 408, 429 and 5xx). Any other 4xx means the
          # request itself was rejected, so it fails right away instead of being repeated for minutes.
          # The body is written to a file that is replaced on every attempt, so the final response never
          # contains the error bodies of earlier attempts
          attempt=1
          while true; do
            rm -f /tmp/response.json
            http_code=$(curl --silent --show-error \
              -X 'POST' "$URL/v3/artifactinfos" \
              -H "Authorization: Bearer $JWT" \
              -H 'Content-Type: application/json' \
              --data-binary '@/tmp/payload.json' \
              --output /tmp/response.json \
              --write-out '%{http_code}') || true
            response=$(cat /tmp/response.json 2>/dev/null) || true

            case "$http_code" in
              2??) break ;;
              000|408|429|5??) ;;
              *)
                echo "CloudBees Unify API call failed with HTTP status $http_code: $response"
                exit 1
                ;;
            esac

            if [ $attempt -ge $MAX_ATTEMPTS ]; then
              echo "CloudBees Unify API call failed after $attempt attempts with HTTP status $http_code: $response"
              exit 1
            fi
            echo "CloudBees Unify API call attempt $attempt of $MAX_ATTEMPTS failed with HTTP status $http_code, retrying in ${RETRY_DELAY}s..."
            attempt=$((attempt + 1))
            sleep $RETRY_DELAY
          done

          # If successful, show the response nicely
          echo ""
          echo "CloudBees Unify API success response:"
          echo "$response" | jq || echo "$response"
          
          # Extract the artifactId
          id=$(echo "$response" | jq -r '.id // empty') || {
            echo "Error: CloudBees Unify API response is not valid JSON."
            exit 1
          }

          registered_ids_json=$(echo "$registered_ids_json" | jq --compact-output --arg k "$inputUrl" --arg v "$id" '. + {($k): $v}')
        
          # add a separator between artifacts but not after the last one
          [ $i -lt $((artifact_count - 1)) ] && printf "\n\n\n"
        done

        # Store outputs
        if [ "$(echo "$registered_ids_json" | jq 'length > 0')" = "true" ]; then       
          # Set the list of registered IDs as a JSON array output
          echo "$registered_ids_json" > $CLOUDBEES_OUTPUTS/artifact-ids
        fi

      env:
        JWT: ${{ cloudbees.api.token }}
        URL: ${{ cloudbees.api.url }}
        INPUT_METADATA: ${{ inputs.artifact-metadata }}
        CLOUDBEES_RUN_ID: ${{ cloudbees.run_id }}
        CLOUDBEES_RUN_ATTEMPT: ${{ cloudbees.run_attempt }}

